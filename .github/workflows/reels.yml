name: Instagram Reels

# Builds Reels from the shop's photos with ffmpeg (installed on the free GitHub
# runner each time) and posts them. Separate from publish.yml so a long drip run never
# holds a Reel back.
on:
  # Six Reels a day, about every two and a half hours: 9am, 11:30am, 2pm,
  # 4:30pm, 7pm and 9:30pm Pacific in daylight time (an hour earlier after it
  # ends, still inside reel.mjs's 8am-11pm posting window). GitHub can start
  # scheduled runs late, which is harmless here.
  schedule:
    - cron: '0 16,21,2 * * *'
    - cron: '30 18,23,4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview = render without posting (download from the run page); post = publish the next Reel'
        type: choice
        options: [preview, post]
        default: preview
      count:
        description: 'preview: how many to render'
        default: '2'
      handles:
        description: 'preview: specific product handles, comma separated (optional)'
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: instagram-reels
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # BtbN's full static build (with the text filter the slides need), fetched
      # from GitHub: Ubuntu's package mirrors have hung for 10+ minutes.
      - name: Install ffmpeg
        run: |
          curl -sSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"

      - name: Build or post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.event.inputs.mode || 'post' }}
          REEL_COUNT: ${{ github.event.inputs.count || '2' }}
          HANDLES: ${{ github.event.inputs.handles || '' }}
        run: |
          ffmpeg -version | head -1
          rc=0; node reel.mjs || rc=$?
          if [ "$MODE" = post ] && [ -f reels.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reels.json
            if ! git diff --cached --quiet; then
              git commit -qm "Record Instagram reel"
              git pull -q --rebase
              git push -q
            fi
          fi
          # Tag it now rather than waiting for the hourly tagging run.
          if [ "$MODE" = post ] && [ "$rc" = 0 ]; then gh workflow run tag.yml --ref main -f count=3 || true; fi
          [ "$rc" = 75 ] && rc=0
          exit $rc

      - name: Keep the previews
        if: github.event.inputs.mode == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: reel-previews
          path: previews/
