name: Publish to Instagram

on:
  # Watchdog only: it never posts, it just restarts the drip if the drip has
  # died (GitHub occasionally shuts a runner down mid-run). GitHub fires
  # frequent schedules unreliably, which is fine for a safety net.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = test without posting; publish = post the next piece now; burst = post several in a row; drip = post steadily, keep restarting, and pick up new listings; reconcile = match failed posts against the account; tag = tag posts with their shop products'
        type: choice
        options: [check, publish, burst, drip, reconcile, tag]
        default: check
      count:
        description: 'burst: how many to post. tag: how many posts to tag'
        default: '20'
      interval_minutes:
        description: 'burst and drip: minutes between posts'
        default: '30'

permissions:
  contents: write
  actions: write

env:
  # Pace the watchdog restarts with.
  DRIP_INTERVAL: '30'

jobs:
  watchdog:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restart the drip if it has stopped
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f blocked.txt ]; then
            echo "Posting stopped after an Instagram block; not restarting:"; cat blocked.txt; exit 0
          fi
          active=$(gh run list -R "$GITHUB_REPOSITORY" -w publish.yml -e workflow_dispatch -L 20 --json status --jq '[.[]|select(.status!="completed")]|length')
          if [ "$active" != 0 ]; then echo "A run is active; nothing to do."; exit 0; fi
          echo "No drip running; restarting it."
          gh workflow run publish.yml --ref main -f mode=drip -f interval_minutes="$DRIP_INTERVAL"

  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Never let two runs post at the same time.
    concurrency:
      group: instagram-publish
      cancel-in-progress: false
    # GitHub's maximum. A drip run stops itself well before this and restarts.
    timeout-minutes: 355
    steps:
      # Always the latest main, not the commit the run was queued on, so a run
      # that waited in the queue still sees every post recorded since.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.event.inputs.mode || 'publish' }}
          COUNT: ${{ github.event.inputs.count || '1' }}
          INTERVAL: ${{ github.event.inputs.interval_minutes || '30' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Commit progress after every post, so a cancelled run never loses
          # track of what already went out.
          save() {
            git add published.json posts.json known.json
            [ -f tags.json ] && git add tags.json
            if ! git diff --cached --quiet; then
              git commit -qm "Record Instagram post"
              git pull -q --rebase
              git push -q
            fi
          }

          # Product tags need their own token, so tagging never holds up posting:
          # a refused token is reported and skipped, not treated as a block.
          tag() {
            set +e; TAG_LIMIT="$1" node tag.mjs; set -e
            save
          }

          if [ "$MODE" = tag ]; then
            tag "$COUNT"
            exit 0
          fi

          if [ "$MODE" = check ] || [ "$MODE" = publish ] || [ "$MODE" = reconcile ]; then
            rc=0; node publish.mjs || rc=$?
            save
            # 75 is a quota or rate-limit pause, which is expected, not a failure.
            [ "$rc" = 75 ] && rc=0
            exit $rc
          fi

          # burst: COUNT posts. drip: runs indefinitely, restarting every ~5 hours;
          # once the queue is empty it keeps checking the shop for new listings.
          started=$(date +%s)
          i=0
          while :; do
            i=$((i + 1))
            git pull -q --rebase
            set +e
            MODE=publish MIN_GAP_MINUTES=$(( INTERVAL > 2 ? INTERVAL - 2 : 0 )) node publish.mjs 2>&1 | tee run.log
            rc=${PIPESTATUS[0]}
            set -e
            save
            if [ "$rc" = 76 ]; then
              # Leave a marker so the watchdog doesn't keep hammering a block.
              # Delete blocked.txt once the block is cleared.
              { date -u +%FT%TZ; tail -3 run.log; } > blocked.txt
              git add blocked.txt && git commit -qm "Stop posting: Instagram blocked the account or token" && git pull -q --rebase && git push -q
              exit 1
            fi
            # Tag the post that just went up, plus a couple from the backlog.
            tag 3
            if [ "$MODE" = burst ] && [ "$i" -ge "$COUNT" ]; then exit 0; fi
            if [ "$MODE" = drip ] && [ $(( $(date +%s) - started )) -gt $(( 300 * 60 )) ]; then
              echo "Restarting to stay inside GitHub's time limit."
              gh workflow run publish.yml --ref main -f mode=drip -f interval_minutes="$INTERVAL"
              exit 0
            fi
            # A quota pause (75) just waits for the next interval like any other.
            sleep $(( INTERVAL * 60 ))
          done
