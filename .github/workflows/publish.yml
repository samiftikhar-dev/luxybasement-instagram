name: Publish to Instagram

on:
  schedule:
    # Backup trigger. GitHub fires frequent schedules unreliably (sometimes
    # hours apart), so the main driver is the self-restarting "drip" run below.
    - cron: '6,18,30,42,54 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = test without posting; publish = post the next piece now; burst = post several in a row; drip = post steadily and keep restarting until the queue is empty; reconcile = match failed posts against the account'
        type: choice
        options: [check, publish, burst, drip, reconcile]
        default: check
      count:
        description: 'burst only: how many to post'
        default: '20'
      interval_minutes:
        description: 'burst and drip: minutes between posts'
        default: '12'

permissions:
  contents: write
  actions: write

# Never let two runs post at the same time. Scheduled runs that fire during a
# burst or drip wait for it to finish.
concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # GitHub's maximum. A drip run stops itself well before this and restarts.
    timeout-minutes: 355
    steps:
      # Always the latest main, not the commit the run was queued on, so a run
      # that waited in the queue still sees every post recorded since.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.event.inputs.mode || 'publish' }}
          COUNT: ${{ github.event.inputs.count || '1' }}
          INTERVAL: ${{ github.event.inputs.interval_minutes || '12' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Commit progress after every post, so a cancelled run never loses
          # track of what already went out.
          save() {
            git add published.json
            if ! git diff --cached --quiet; then
              git commit -qm "Record Instagram post"
              git pull -q --rebase
              git push -q
            fi
          }
          # Queue is done when every post is published, or failed out.
          remaining() {
            node -e "const p=require('./posts.json'),s=require('./published.json');console.log(p.filter(x=>!s[x.id]||(s[x.id].status==='failed'&&s[x.id].attempts<2)).length)"
          }

          if [ "$MODE" = check ] || [ "$MODE" = publish ] || [ "$MODE" = reconcile ]; then
            rc=0; node publish.mjs || rc=$?
            save
            # 75 is a quota or rate-limit pause, which is expected, not a failure.
            [ "$rc" = 75 ] && rc=0
            exit $rc
          fi

          # burst: COUNT posts. drip: as many as fit in ~5 hours, then restart.
          started=$(date +%s)
          i=0
          while :; do
            i=$((i + 1))
            git pull -q --rebase
            rc=0; MODE=publish MIN_GAP_MINUTES=$(( INTERVAL > 2 ? INTERVAL - 2 : 0 )) node publish.mjs || rc=$?
            save
            if [ "$rc" = 76 ]; then exit 1; fi
            if [ "$(remaining)" = 0 ]; then echo "Queue finished."; exit 0; fi
            if [ "$MODE" = burst ] && [ "$i" -ge "$COUNT" ]; then exit 0; fi
            if [ "$MODE" = drip ] && [ $(( $(date +%s) - started )) -gt $(( 300 * 60 )) ]; then
              echo "Restarting to stay inside GitHub's time limit."
              gh workflow run publish.yml --ref main -f mode=drip -f interval_minutes="$INTERVAL"
              exit 0
            fi
            # A quota pause (75) just waits for the next interval like any other.
            sleep $(( INTERVAL * 60 ))
          done
